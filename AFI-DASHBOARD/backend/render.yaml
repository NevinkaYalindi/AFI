services:
  - type: web
    name: afi-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AFI_MODELS_DIR
        value: AFITraining/models

  - type: web
    name: afi-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://afi-backend.onrender.com